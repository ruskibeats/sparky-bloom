---
name: "Prod Bug"
description: "A bug in the stolen SparkyFitness upstream code"
title: "[Prod] Short description"
labels: ["bug", "prod"]
body:
  - type: markdown
    attributes:
      value: |
        ## Reporting a bug in the upstream (SparkyFitness) codebase.

        The `prod/` directory tracks bugs in the boring bits we stole.
        Fixes here may need to be upstreamed to SparkyFitness.

  - type: input
    id: module
    attributes:
      label: Affected module
      description: Which prod/ module has the bug?
      placeholder: "SparkyFitnessServer / SparkyFitnessMobile / shared / docker"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What breaks, and how does it manifest?
      placeholder: "The food search API returns 500 when searching for 'pizza' after 8pm"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps to see the bug
      placeholder: |
        1. Start the server with `docker compose up`
        2. Call `GET /api/foods/search?q=pizza` at 8:05pm
        3. Observe 500 error
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Blocker — cannot proceed without fix"
        - "Major — feature broken, workaround exists"
        - "Minor — cosmetic or edge case"
        - "Trivial — docs, log noise"
    validations:
      required: true

  - type: input
    id: workaround
    attributes:
      label: Workaround
      description: If there's a known workaround, describe it
      placeholder: "Call the v2 endpoint instead"

  - type: checkboxes
    id: upstream
    attributes:
      label: Upstream
      options:
        - label: "This bug exists in the original SparkyFitness codebase"
        - label: "We should upstream the fix"