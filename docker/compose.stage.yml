name: sparkybloom-stage
# sparky-bloom — Stage stack
# Ports: 3011 (server), 3006 (frontend)
# Usage: docker compose -f docker/compose.stage.yml up -d

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sparkybloom_stage
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: stage-password
    volumes:
      - sparkybloom_stage_data:/var/lib/postgresql
    networks:
      - stage-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: production
      SPARKY_FITNESS_DB_HOST: db
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: sparkybloom_stage
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: stage-password
      SPARKY_FITNESS_APP_DB_USER: sparky
      SPARKY_FITNESS_APP_DB_PASSWORD: stage-password
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY:?SPARKY_FITNESS_API_ENCRYPTION_KEY required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:3006
      LOG_LEVEL: info
      PUBLIC_API_DOCS: "true"
    networks:
      - stage-backend
      - stage-frontend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3011:3010"

  nginx:
    image: codewithcj/sparkyfitness:latest
    environment:
      SPARKY_FITNESS_SERVER_HOST: server
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:3006
    networks:
      - stage-frontend
    depends_on:
      - server
    ports:
      - "3006:80"

networks:
  stage-backend:
    internal: true
  stage-frontend:

volumes:
  sparkybloom_stage_data: